<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Announcements – CryptoX Admin</title>
<link rel="stylesheet" href="../css/style.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo"><a href="../index.html" style="display:flex;align-items:center;gap:6px;text-decoration:none"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="30" rx="6" fill="#f0b90b"/><path d="M15 4.5L20.5 8V12L15 8.5L9.5 12V8L15 4.5Z" fill="#111" fill-opacity="0.9"/><path d="M9.5 12V19.5L15 23L20.5 19.5V12L15 15.5L9.5 12Z" fill="#111" fill-opacity="0.75"/><path d="M15 15.5L20.5 12V19.5L15 23V15.5Z" fill="#111" fill-opacity="0.5"/></svg><span style="font-size:15px;font-weight:800;color:var(--white)">CryptoX</span></a><span class="admin-badge">ADMIN</span></div>
    <nav class="admin-menu">
      <div class="menu-sec">OVERVIEW</div><a href="dashboard.html" class="a-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <div class="menu-sec">USERS</div><a href="users.html" class="a-item"><i class="fas fa-users"></i><span>All Users</span></a><a href="kyc.html" class="a-item"><i class="fas fa-id-card"></i><span>KYC Reviews</span></a>
      <div class="menu-sec">FINANCE</div><a href="deposits.html" class="a-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a><a href="withdrawals.html" class="a-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a><a href="fees.html" class="a-item"><i class="fas fa-percent"></i><span>Fees</span></a>
      <div class="menu-sec">TRADING</div><a href="markets.html" class="a-item"><i class="fas fa-coins"></i><span>Markets</span></a><a href="orders.html" class="a-item"><i class="fas fa-list-alt"></i><span>Orders</span></a>
      <div class="menu-sec">SYSTEM</div><a href="announcements.html" class="a-item active"><i class="fas fa-bullhorn"></i><span>Announcements</span></a><a href="settings.html" class="a-item"><i class="fas fa-cog"></i><span>Settings</span></a>
    </nav>
    <div style="border-top:1px solid var(--border);padding:8px"><a href="../dashboard.html" class="a-item"><i class="fas fa-user"></i><span>User View</span></a><div class="a-item" style="color:var(--red);cursor:pointer" onclick="authLogout()"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></div></div>
  </aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap12"><button style="background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer" onclick="document.querySelector('.admin-sidebar').classList.toggle('collapsed')"><i class="fas fa-bars"></i></button><h2>Announcements</h2></div>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('annModal').classList.remove('hidden')"><i class="fas fa-plus"></i> New Announcement</button>
    </div>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-head"><h3>Published Announcements</h3><button class="btn btn-ghost btn-xs" onclick="loadAnnouncements()"><i class="fas fa-refresh"></i></button></div>
        <div class="admin-card-body">
          <table class="data-table">
            <thead><tr><th>Title</th><th>Type</th><th>Target</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="annTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Create Modal -->
<div class="modal-overlay hidden" id="annModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Create Announcement</h3><button class="modal-close" onclick="document.getElementById('annModal').classList.add('hidden')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><input type="text" id="annTitle" class="form-input" placeholder="Announcement title"/></div>
      <div class="form-group"><label>Content</label><textarea id="annContent" class="form-textarea" placeholder="Announcement content..." style="min-height:100px"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Type</label><select id="annType" class="form-select"><option value="info">Info</option><option value="warning">Warning</option><option value="critical">Critical</option><option value="success">Success</option></select></div>
        <div class="form-group"><label>Target</label><select id="annTarget" class="form-select"><option value="all">All Users</option><option value="verified">Verified Only</option><option value="traders">Active Traders</option></select></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="document.getElementById('annModal').classList.add('hidden')">Cancel</button><button class="btn btn-primary" onclick="createAnnouncement()"><i class="fas fa-paper-plane"></i> Publish</button></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await initAuthOnLoad();
  const user = requireAdmin(); if (!user) return;
  loadAnnouncements();
});

async function loadAnnouncements() {
  const tbody = document.getElementById('annTbody'); if (!tbody) return;
  try {
    const token=localStorage.getItem('cx_token');
    if (token) {
      const r=await fetch('/api/admin/announcements',{headers:{'Authorization':'Bearer '+token}});
      const d=await r.json();
      if (d.success) { renderAnns(d.announcements); return; }
    }
  }catch(e){}
  renderAnns([]);
}

function renderAnns(anns) {
  const tbody=document.getElementById('annTbody'); if(!tbody) return;
  if (!anns.length) { tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--t3)"><i class="fas fa-bullhorn" style="font-size:24px;display:block;margin-bottom:8px;opacity:.3"></i>No announcements yet</td></tr>'; return; }
  tbody.innerHTML = anns.map(a=>`<tr>
    <td style="font-weight:600">${a.title}</td>
    <td><span class="ann-type ann-${a.type||'info'}">${a.type||'info'}</span></td>
    <td style="color:var(--t2);font-size:12px">${a.target||'all'}</td>
    <td style="font-size:11px;color:var(--t3)">${new Date(a.created_at).toLocaleDateString()}</td>
    <td><span class="status-pill ${a.is_active?'sp-filled':'sp-cancelled'}">${a.is_active?'Active':'Inactive'}</span></td>
    <td><div class="flex gap4">
      <button class="btn btn-ghost btn-xs" onclick="toggleAnn(${a.id},${a.is_active?0:1})">${a.is_active?'Disable':'Enable'}</button>
      <button class="btn btn-dark btn-xs" onclick="deleteAnn(${a.id})"><i class="fas fa-trash" style="color:var(--red)"></i></button>
    </div></td>
  </tr>`).join('');
}

async function createAnnouncement() {
  const title   = document.getElementById('annTitle').value.trim();
  const content = document.getElementById('annContent').value.trim();
  const type    = document.getElementById('annType').value;
  const target  = document.getElementById('annTarget').value;
  if (!title||!content) { showToast('Title and content required','t-err'); return; }
  try {
    const token=localStorage.getItem('cx_token');
    if (token) {
      const r=await fetch('/api/admin/announcements',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({title,content,type,target})});
      const d=await r.json();
      if (d.success) { showToast('Announcement published!','t-ok'); document.getElementById('annModal').classList.add('hidden'); document.getElementById('annTitle').value=''; document.getElementById('annContent').value=''; loadAnnouncements(); return; }
    }
  }catch(e){}
  showToast('Announcement saved (offline)','t-ok');
  document.getElementById('annModal').classList.add('hidden');
}

async function toggleAnn(id, active) {
  try {
    const token=localStorage.getItem('cx_token');
    if (token) { const r=await fetch('/api/admin/announcements/'+id,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({is_active:active})}); const d=await r.json(); if(d.success){loadAnnouncements();return;} }
  }catch(e){}
  showToast('Updated','t-ok');
}

async function deleteAnn(id) {
  if (!confirm('Delete this announcement?')) return;
  try {
    const token=localStorage.getItem('cx_token');
    if (token) { const r=await fetch('/api/admin/announcements/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}}); const d=await r.json(); if(d.success){showToast('Deleted','t-ok');loadAnnouncements();return;} }
  }catch(e){}
  showToast('Deleted','t-ok');
}

function showToast(msg,type='t-info'){
  const c=document.getElementById('toastContainer'); if(!c)return;
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML=`<i class="toast-icon fas fa-${type==='t-ok'?'check':'info'}-circle"></i><span class="toast-msg">${msg}</span>`;
  c.appendChild(t); setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3000);
}
</script>
</body>
</html>
