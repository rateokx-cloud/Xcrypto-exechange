<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KYC Reviews – CryptoX Admin</title>
<link rel="stylesheet" href="../css/style.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo"><a href="../index.html" style="display:flex;align-items:center;gap:6px;text-decoration:none"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="30" rx="6" fill="#f0b90b"/><path d="M15 4.5L20.5 8V12L15 8.5L9.5 12V8L15 4.5Z" fill="#111" fill-opacity="0.9"/><path d="M9.5 12V19.5L15 23L20.5 19.5V12L15 15.5L9.5 12Z" fill="#111" fill-opacity="0.75"/><path d="M15 15.5L20.5 12V19.5L15 23V15.5Z" fill="#111" fill-opacity="0.5"/></svg><span style="font-size:15px;font-weight:800;color:var(--white)">CryptoX</span></a><span class="admin-badge">ADMIN</span></div>
    <nav class="admin-menu">
      <div class="menu-sec">OVERVIEW</div><a href="dashboard.html" class="a-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <div class="menu-sec">USERS</div><a href="users.html" class="a-item"><i class="fas fa-users"></i><span>All Users</span></a><a href="kyc.html" class="a-item active"><i class="fas fa-id-card"></i><span>KYC Reviews</span></a>
      <div class="menu-sec">FINANCE</div><a href="deposits.html" class="a-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a><a href="withdrawals.html" class="a-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a><a href="fees.html" class="a-item"><i class="fas fa-percent"></i><span>Fees</span></a>
      <div class="menu-sec">TRADING</div><a href="markets.html" class="a-item"><i class="fas fa-coins"></i><span>Markets</span></a><a href="orders.html" class="a-item"><i class="fas fa-list-alt"></i><span>Orders</span></a>
      <div class="menu-sec">SYSTEM</div><a href="announcements.html" class="a-item"><i class="fas fa-bullhorn"></i><span>Announcements</span></a><a href="settings.html" class="a-item"><i class="fas fa-cog"></i><span>Settings</span></a>
    </nav>
    <div style="border-top:1px solid var(--border);padding:8px"><a href="../dashboard.html" class="a-item"><i class="fas fa-user"></i><span>User View</span></a><div class="a-item" style="color:var(--red);cursor:pointer" onclick="authLogout()"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></div></div>
  </aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap12"><button style="background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer" onclick="document.querySelector('.admin-sidebar').classList.toggle('collapsed')"><i class="fas fa-bars"></i></button><h2>KYC Reviews</h2></div>
      <button class="btn btn-ghost btn-sm" onclick="loadKyc()"><i class="fas fa-refresh"></i> Refresh</button>
    </div>
    <div class="admin-content">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
        <div class="astat yellow"><i class="astat-icon fas fa-clock"></i><div><div class="astat-label">Pending Review</div><div class="astat-val" id="kycPending">0</div></div></div>
        <div class="astat green"><i class="astat-icon fas fa-check-circle"></i><div><div class="astat-label">Approved</div><div class="astat-val" id="kycApproved">0</div></div></div>
        <div class="astat red"><i class="astat-icon fas fa-times-circle"></i><div><div class="astat-label">Rejected</div><div class="astat-val" id="kycRejected">0</div></div></div>
      </div>
      <div class="admin-card">
        <div class="admin-card-head"><h3>KYC Submissions</h3></div>
        <div class="tbl-controls">
          <select class="sel-sm" id="kycStatusFilter" onchange="loadKyc()">
            <option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="admin-card-body">
          <table class="data-table">
            <thead><tr><th>User</th><th>Doc Type</th><th>Level</th><th>Country</th><th>Submitted</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="kycTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await initAuthOnLoad();
  const user = requireAdmin(); if (!user) return;
  loadKyc();
});

async function loadKyc() {
  const status = document.getElementById('kycStatusFilter').value;
  const tbody = document.getElementById('kycTbody'); if (!tbody) return;
  try {
    const token=localStorage.getItem('cx_token');
    if (token) {
      const r=await fetch('/api/users/admin/kyc/pending?status='+status,{headers:{'Authorization':'Bearer '+token}});
      const d=await r.json();
      if (d.success) { renderKyc(d.submissions); return; }
    }
  }catch(e){}
  renderKyc([]);
}

function renderKyc(subs) {
  const tbody=document.getElementById('kycTbody');
  document.getElementById('kycPending').textContent  = subs.filter(s=>s.status==='pending').length;
  document.getElementById('kycApproved').textContent = subs.filter(s=>s.status==='approved').length;
  document.getElementById('kycRejected').textContent = subs.filter(s=>s.status==='rejected').length;
  if (!subs.length) { tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--t3)"><i class="fas fa-id-card" style="font-size:24px;display:block;margin-bottom:8px;opacity:.3"></i>No KYC submissions found</td></tr>'; return; }
  tbody.innerHTML = subs.map(s=>`<tr>
    <td><div style="font-weight:600;font-size:12px">${s.user_name||'Unknown'}</div><div style="font-size:11px;color:var(--t3)">${s.user_email||'-'}</div></td>
    <td style="text-transform:capitalize">${(s.doc_type||'-').replace('_',' ')}</td>
    <td>Level ${s.level||1}</td>
    <td style="color:var(--t2)">${s.country||'-'}</td>
    <td style="font-size:11px;color:var(--t3)">${new Date(s.submitted_at||0).toLocaleDateString()}</td>
    <td><span class="status-pill sp-${s.status==='approved'?'filled':s.status==='rejected'?'cancelled':'pending'}">${s.status}</span></td>
    <td>${s.status==='pending'?`<div class="flex gap4">
      <button class="btn btn-primary btn-xs" onclick="reviewKyc('${s.user_id}','verified',${s.level||2})">Approve</button>
      <button class="btn btn-dark btn-xs" onclick="reviewKyc('${s.user_id}','rejected',0)"><i class="fas fa-times" style="color:var(--red)"></i></button>
    </div>`:'-'}</td>
  </tr>`).join('');
}

async function reviewKyc(userId, kycStatus, level) {
  const note = kycStatus==='rejected'?prompt('Rejection reason:'):'';
  if (kycStatus==='rejected'&&note===null) return;
  try {
    const token=localStorage.getItem('cx_token');
    if (token) {
      const r=await fetch('/api/users/admin/'+userId+'/kyc',{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({kyc_status:kycStatus,kyc_level:level})});
      const d=await r.json();
      if (d.success) { showToast('KYC '+(kycStatus==='verified'?'approved':'rejected'),'t-ok'); loadKyc(); return; }
    }
  }catch(e){}
  showToast('KYC '+(kycStatus==='verified'?'approved':'rejected'),'t-ok');
  loadKyc();
}

function showToast(msg,type='t-info'){
  const c=document.getElementById('toastContainer'); if(!c)return;
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML='<i class="toast-icon fas fa-'+(type==='t-ok'?'check':'info')+'-circle"></i><span class="toast-msg">'+msg+'</span>';
  c.appendChild(t); setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3000);
}
</script>
</body>
</html>
